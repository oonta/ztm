apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ztm-node
  namespace: ztm
  labels:
    app.kubernetes.io/name: ztm-node
    app.kubernetes.io/component: gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ztm-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ztm-node
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: ztm-node
      tolerations:
        - operator: Exists
      containers:
        - name: ztm-node
          image: ztm-node:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ZTM_DATA_DIR
              value: /var/lib/ztm
          envFrom:
            - configMapRef:
                name: ztm-node
          ports:
            - name: client-quic
              containerPort: 7443
              protocol: UDP
            - name: mesh-quic
              containerPort: 7444
              protocol: UDP
            - name: gossip
              containerPort: 7946
              protocol: UDP
            - name: admin
              containerPort: 8080
              protocol: TCP
            - name: rpc
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/status
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/status
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/ztm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /var/lib/ztm
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
